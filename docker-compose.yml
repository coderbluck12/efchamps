services:
  postgres:
    image: postgres:16-alpine
    container_name: efchamps_postgres
    restart: always
    environment:
      POSTGRES_USER: efchamps
      POSTGRES_PASSWORD: efchamps_secure_password_2026
      POSTGRES_DB: efchamps_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - efchamps_network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: efchamps_backend
    restart: always
    depends_on:
      - postgres
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://efchamps:efchamps_secure_password_2026@postgres:5432/efchamps_db
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: efchamps
      DATABASE_PASSWORD: efchamps_secure_password_2026
      DATABASE_NAME: efchamps_db
      DATABASE_SYNC: "true"
      JWT_SECRET: efchamps_super_secure_jwt_secret_key_9941
      FRONTEND_URL: https://efchamps.app
    networks:
      - efchamps_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: efchamps_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api
    networks:
      - efchamps_network

  nginx:
    image: nginx:alpine
    container_name: efchamps_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - efchamps_network

volumes:
  postgres_data:

networks:
  efchamps_network:
    driver: bridge
